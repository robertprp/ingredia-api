name: aditivos-api

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-api}?schema=public
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-api}?schema=public
      APP_NAME: ${APP_NAME:-Aditivos App}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-only-change-before-deploying}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:3000}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Set GOOGLE_CLOUD_PROJECT in .env}
      GOOGLE_CLOUD_VISION_ENDPOINT: ${GOOGLE_CLOUD_VISION_ENDPOINT:-eu-vision.googleapis.com}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:?Set GOOGLE_CLOUD_VISION_API_KEY in .env}
      BILLING_SEED_USER_ID: ${BILLING_SEED_USER_ID:-}
      BILLING_RETURN_URL_ORIGINS: ${BILLING_RETURN_URL_ORIGINS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PLUS_MONTHLY_PRICE_ID: ${STRIPE_PLUS_MONTHLY_PRICE_ID:-}
      APPLE_PLUS_MONTHLY_PRODUCT_ID: ${APPLE_PLUS_MONTHLY_PRODUCT_ID:-}
      GOOGLE_PLAY_PLUS_MONTHLY_PRODUCT_ID: ${GOOGLE_PLAY_PLUS_MONTHLY_PRODUCT_ID:-}
      APPLE_VERIFIER_URL: ${APPLE_VERIFIER_URL:-}
      APPLE_VERIFIER_API_KEY: ${APPLE_VERIFIER_API_KEY:-}
      GOOGLE_PLAY_VERIFIER_URL: ${GOOGLE_PLAY_VERIFIER_URL:-}
      GOOGLE_PLAY_VERIFIER_API_KEY: ${GOOGLE_PLAY_VERIFIER_API_KEY:-}
      PPQ_API_KEY: ${PPQ_API_KEY:-}
      PPQ_BASE_URL: ${PPQ_BASE_URL:-https://api.ppq.ai}
      PPQ_MODEL: ${PPQ_MODEL:-perplexity/sonar-pro}
      PPQ_TIMEOUT_MS: ${PPQ_TIMEOUT_MS:-120000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
